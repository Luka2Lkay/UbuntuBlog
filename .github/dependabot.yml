version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: "weekly"

    groups:
      frontend-dependencies:
        patterns: 
         - "*"   

  - package-ecosystem: npm
    directory: "/backend"
    target-branch: develop
    schedule:
      interval: "weekly"

    groups:
      backend-dependencies:
        patterns:
          - "*"
