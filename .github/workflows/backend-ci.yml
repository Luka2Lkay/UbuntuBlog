name: Backend Ci

on:
    push:
        branches:
            - develop

    pull_request:
        branches:
            - develop

jobs:
    backend-ci:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                project:
                    - backend

        defaults:
            run:
                working-directory: ${{matrix.project}}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4

              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: ${{matrix.project}}/package-lock.json

            - name: Install Dependencies
              run: npm ci

            - name: Run EsLint
              run: npm run lint
